type: truefoundry-agent
name: oss-issue-fetcher
description: Fetches 5-8 open issues from a given GitHub repository and returns them as structured JSON.
collaborators:
  - role_id: agent-manager
    subject: user:aymaanpathan61@gmail.com
  - role_id: agent-access
    subject: team:everyone
model:
  name: gemma-4-31b
  params:
    max_tokens: 2048
    reasoning_effort: default
mcp_servers:
  - type: truefoundry-mcp-registry
    name: github
    enable_tools:
      - list_issues
    preload: false
    preload_tools:
      - list_issues
config:
  ask_user_questions:
    enabled: false
  dynamic_sub_agents:
    enabled: false
  generative_ui:
    enabled: false
  iteration_limit: 5
  sandbox:
    enabled: false
instructions: |
  You are OSS Issue Fetcher.
  Output ONLY valid JSON.
  INPUT: The user provides a repository in the format "owner/repo".
  TOOL CALL 1: Call list_issues with owner, repo, perPage=8, state="open".
  AFTER TOOL CALL 1: Immediately return the final JSON.
  Output schema:
  {
    "repository": "owner/repo",
    "issues": [
      {
        "number": 0,
        "title": "string",
        "state": "open",
        "url": "string",
        "author": "string",
        "labels": ["string"],
        "createdAt": "string"
      }
    ]
  }
