type: truefoundry-agent
name: oss-issues-agent

collaborators:
  - role_id: agent-manager
    subject: user:aymaanpathan5@gmail.com

  - role_id: agent-access
    subject: team:everyone

description: >-
  Fetches one paginated page of open GitHub issues for a selected repository.

config:
  ask_user_questions:
    enabled: false

  context_management:
    compaction:
      enabled: true
      compaction_threshold_tokens: 12000

    large_tool_response:
      enabled: false

  dynamic_sub_agents:
    enabled: false

  generative_ui:
    enabled: false

  iteration_limit: 8

  sandbox:
    enabled: false

instructions: |
  Fetch one page of open GitHub issues for the provided repository.

  Extract the repository owner and repository name.

  Call list_issues exactly once with:
  - state: OPEN
  - perPage: 10
  - fields: number, title, labels

  If the input contains an "After" cursor, pass it unchanged
  as the after parameter.

  Do not fetch additional pages.

  After list_issues returns, do not call any more tools.

  Return valid JSON only in exactly this format:

  {
    "issues": [
      {
        "number": 123,
        "title": "Issue title",
        "labels": ["label1"],
        "url": "https://github.com/owner/repo/issues/123"
      }
    ],
    "nextCursor": "cursor-or-empty-string"
  }

  Construct each URL using the repository owner, repository name,
  and issue number.

  If there is no next page, set nextCursor to an empty string.

mcp_servers:
  - type: truefoundry-mcp-registry
    name: github

    enable_tools:
      - list_issues

    preload: true

    preload_tools:
      - list_issues

    require_approval_for_tools:
      - "@write"
      - "@destructive"

model:
  name: cerebras/gpt-oss-120b
  params:
    max_tokens: 1500
    reasoning_effort: low