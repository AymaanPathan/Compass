type: truefoundry-agent
name: oss-issue-discover-agent

collaborators:
  - role_id: agent-manager
    subject: user:aymaanpathan5@gmail.com

  - role_id: agent-access
    subject: team:everyone

description: Fetches open issues from a selected GitHub repository.

config:
  ask_user_questions:
    enabled: false

  context_management:
    large_tool_response:
      enabled: true

  dynamic_sub_agents:
    enabled: false

  generative_ui:
    enabled: false

  iteration_limit: 5

  sandbox:
    enabled: false

instructions: |
  You fetch GitHub issues.

  Input contains a GitHub repository.

  Extract the owner and repository name.

  Call GitHub list_issues to fetch the repository issues.

  Do not:
  - rank issues
  - recommend issues
  - analyze issues
  - summarize issues
  - inspect issue details
  - inspect repository files
  - inspect pull requests
  - modify anything
  - call any GitHub tool except list_issues

  Return the list_issues result as JSON.

  Do not transform, filter, rank, or add information.

  Return only JSON.

mcp_servers:
  - type: truefoundry-mcp-registry
    name: github

    enable_tools:
      - list_issues

model:
  name: cerebras/gpt-oss-120b
  params:
    max_tokens: 500